name: CI

on:
  push:
    branches: [ "main", "phase/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Lint
        run: pnpm --filter "./apps/*" lint
        
      - name: Type Check
        run: pnpm --filter "./apps/*" typecheck
        
      - name: Test
        run: pnpm --filter "./apps/*" test
        
      - name: Build
        run: pnpm --filter "./apps/*" build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Sync dependencies
        working-directory: ./services/api
        run: uv sync --frozen
      - name: Lint with Ruff
        working-directory: ./services/api
        run: uv run --frozen ruff check .
      - name: Format Check with Ruff
        working-directory: ./services/api
        run: uv run --frozen ruff format --check .
      - name: Type check with mypy
        working-directory: ./services/api
        run: uv run --frozen mypy src
      - name: Run unit tests
        working-directory: ./services/api
        run: uv run --frozen pytest -m "not integration"

  infrastructure-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Install Python 3.13
        run: uv python install 3.13
        
      - name: Validate Compose Config
        run: docker compose config --quiet
        
      - name: Build Images
        run: docker compose build
        
      - name: Start Postgres and Redis
        run: docker compose up -d postgres redis
        
      - name: Wait for Postgres and Redis to be healthy
        run: |
          echo "Waiting for postgres and redis..."
          sleep 15
          docker compose ps
          
      - name: Run Migrations
        run: docker compose run --rm migrate
        
      - name: Start API
        run: docker compose up -d api
        
      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API..."
          sleep 15
          docker compose ps
          
      - name: Sync API dependencies for tests
        working-directory: ./services/api
        run: uv sync --frozen
        
      - name: Run Integration Smoke Test
        run: docker compose run --rm api uv run --frozen pytest -m "integration"
          
      - name: Print Logs on Failure
        if: failure()
        run: docker compose logs
        
      - name: Cleanup
        if: always()
        run: docker compose down -v
